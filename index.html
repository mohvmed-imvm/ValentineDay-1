
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise (1)</title>
</head>

<body>

<audio id="birthdayMusic" src="birthday.mp3" loop></audio>

<!-- INTRO: NO 4U ABOVE COUNTDOWN -->

<div class="intro" id="intro">
    <div class="glow"></div>

    <div class="intro-text" id="introText">
        ...something special is waiting u 
    </div>

    <div class="number" id="number">5</div>
</div>

<!-- MAIN PAGE -->

<main class="main" id="main">

    <!-- HEARTS STAY INSIDE THIS CLIPPED LAYER -->
    <div class="heart-layer" id="heartLayer" aria-hidden="true"></div>

    <div class="content">

        <h1 id="pageHeading">.............</h1>

        <div class="subtitle" id="subtitle">
.......
        </div>

        <!-- GIFT AREA -->

        <div class="gift-area" id="giftArea">

            <!-- BOUQUET -->

            <div class="bouquet" id="bouquet">

                <div class="stems">
                    <span class="stem"></span>
                    <span class="stem"></span>
                    <span class="stem"></span>
                    <span class="stem"></span>
                    <span class="stem"></span>

                    <span class="leaf l1"></span>
                    <span class="leaf l2"></span>
                    <span class="leaf l3"></span>
                    <span class="leaf l4"></span>
                </div>

                <div class="wrap-back"></div>

                <div class="flower top-left">
                    <img src="photo1.jpg" alt="Our memory 1">
                </div>

                <div class="flower top-right">
                    <img src="photo2.jpg" alt="Our memory 2">
                </div>

                <div class="flower left">
                    <img src="photo3.jpg" alt="Our memory 3">
                </div>

                <div class="flower right">
                    <img src="photo4.jpg" alt="Our memory 4">
                </div>

                <div class="flower center">
                    <img src="photo5.jpg" alt="Our favorite memory">
                </div>

                <div class="wrap-left"></div>
                <div class="wrap-right"></div>
                <div class="wrap-front"></div>

                <div class="ribbon-band"></div>
                <div class="ribbon-bow"></div>
                <div class="ribbon-knot"></div>

            </div>

            <!-- CLICK THE BOX ONLY -->

            <div
                class="gift-box"
                id="giftBox"
                role="button"
                tabindex="0"
                aria-label="افتح الهدية"
            >
                <div class="lid">
                    <div class="ribbon"></div>
                </div>

                <div class="box-body">
                    <div class="ribbon-vertical"></div>
                </div>
            </div>

            <div class="gift-text" id="giftText">
.........
            </div>

        </div>

        <!-- MESSAGE -->

        <section class="message" id="message">

            <h2>..............</h2>

            <p>

            </p>

        </section>

        <!-- FOOTER -->

        <footer class="site-footer">
            <span>Made with</span>
            <span>4U</span>
        </footer>

    </div>
</main>

<script src="script.js"></script>

</body>
</html>
